<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neue+Haas+Grotesk:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background: #D0CECE;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    position: relative;
    opacity: 1;
    transition: opacity 360ms ease;
  }

  body.is-loading {
    opacity: 0;
  }

  /* Subtle grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
  }

  /* ── Man image ── */
  .man {
    position: absolute;
    top: 0;
    left: 0;
    height: 100vh;
    width: auto;
    max-height: 100vh;
    display: block;
    object-fit: contain;
    object-position: top left;
    transform: translateX(-110%);
    animation: slideInMan 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    z-index: 2;
  }

  @keyframes slideInMan {
    from { transform: translateX(-110%); }
    to   { transform: translateX(0); }
  }

  /* Video container */
  .video-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-10%, -50%);
    z-index: 3;
    opacity: 0;
    animation: fadeUp 0.9s ease 0.22s forwards;
    width: min(44vw, 680px);
    min-width: 380px;
  }

  body.is-loading .man,
  body.is-loading .video-wrap {
    animation-play-state: paused;
  }

  .video-heading {
    margin-bottom: 16px;
    color: #1a1a1a;
    font-size: clamp(34px, 4.3vw, 64px);
    font-weight: 800;
    line-height: 1;
    text-align: center;
    text-wrap: balance;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-10%, -44%); }
    to   { opacity: 1; transform: translate(-10%, -50%); }
  }

  .video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 18px;
    cursor: pointer;
    background:
      linear-gradient(145deg, rgba(232,230,230,0.42), rgba(163,161,161,0.28)),
      #c9c7c7;
    border: 1px solid rgba(255,255,255,0.36);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -24px 64px rgba(26,26,26,0.08),
      0 28px 70px rgba(36,34,34,0.16);
  }

  .video-container video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: inherit;
  }

  .video-container::after {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 17px;
    box-shadow: inset 0 0 90px rgba(208,206,206,0.45);
    pointer-events: none;
  }

  .hero-cta {
    width: 100%;
    margin-top: 20px;
    padding: 18px 24px;
    border: 0;
    border-radius: 14px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    font-size: clamp(20px, 2.1vw, 30px);
    font-weight: 800;
    line-height: 1.12;
    text-align: center;
    box-shadow: 0 22px 48px rgba(26,26,26,0.22);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .hero-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 28px 58px rgba(26,26,26,0.28);
  }

  .hero-cta:disabled {
    cursor: not-allowed;
    background: #5e5c5c;
    color: rgba(255,255,255,0.68);
    box-shadow: none;
    transform: none;
  }

  .slot-timer {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(232,230,230,0.72);
    border: 1px solid rgba(255,255,255,0.35);
    color: #1a1a1a;
    font-size: clamp(14px, 1.15vw, 17px);
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
  }

  .slot-time {
    display: inline-block;
    min-width: 5ch;
    color: #c51f1f;
    font-variant-numeric: tabular-nums;
  }

  body.modal-open .man,
  body.modal-open .video-wrap {
    filter: blur(10px);
    transform: translate(-10%, -50%) scale(0.99);
    pointer-events: none;
  }

  body.modal-open .man {
    transform: translateX(0) scale(0.99);
  }

  .signup-modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(26,26,26,0.32);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s ease, visibility 0.18s ease;
  }

  .signup-modal.is-open {
    opacity: 1;
    visibility: visible;
  }

  .signup-card {
    width: min(92vw, 520px);
    padding: 30px;
    border-radius: 18px;
    background: rgba(232,230,230,0.94);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 32px 90px rgba(0,0,0,0.28);
  }

  .signup-card h2 {
    color: #1a1a1a;
    font-size: clamp(30px, 3.2vw, 44px);
    font-weight: 800;
    line-height: 0.98;
    text-align: center;
    text-wrap: balance;
  }

  .signup-form {
    display: grid;
    gap: 12px;
    margin-top: 24px;
  }

  .signup-form input {
    width: 100%;
    padding: 15px 16px;
    border: 1px solid rgba(26,26,26,0.18);
    border-radius: 12px;
    background: rgba(255,255,255,0.72);
    color: #1a1a1a;
    font: inherit;
    font-size: 16px;
    outline: none;
  }

  .signup-form input:focus {
    border-color: rgba(26,26,26,0.48);
    box-shadow: 0 0 0 3px rgba(26,26,26,0.08);
  }

  .signup-submit,
  .signup-close {
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 800;
  }

  .signup-submit {
    margin-top: 6px;
    background: #1a1a1a;
    color: #fff;
  }

  .signup-close {
    margin-top: 10px;
    background: rgba(255,255,255,0.52);
    color: #1a1a1a;
  }

  .signup-message {
    min-height: 20px;
    margin-top: 12px;
    color: #1a1a1a;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
  }

  @media (max-width: 900px) {
    .video-wrap {
      left: 54%;
      width: min(62vw, 560px);
      min-width: 320px;
    }
  }

  @media (max-width: 640px) {
    body {
      min-height: 100svh;
      padding: 22px 16px 28px;
    }

    .man {
      position: fixed;
      top: 0;
      left: -16vw;
      height: 48svh;
      max-height: 430px;
      opacity: 0.26;
      animation: none;
      transform: none;
      pointer-events: none;
    }

    .video-wrap {
      position: relative;
      top: auto;
      left: auto;
      width: min(100%, 460px);
      min-width: 0;
      margin: 0 auto;
      padding-top: clamp(14px, 6svh, 54px);
      transform: none;
      animation: mobileFadeUp 0.65s ease 0.2s forwards;
    }

    .video-heading {
      margin-bottom: 14px;
      font-size: clamp(30px, 9.2vw, 44px);
      line-height: 1.04;
    }

    .video-container {
      border-radius: 14px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.4),
        inset 0 -18px 48px rgba(26,26,26,0.07),
        0 18px 42px rgba(36,34,34,0.14);
    }

    .hero-cta {
      margin-top: 18px;
      padding: 16px 18px;
      font-size: clamp(20px, 5.7vw, 26px);
      line-height: 1.15;
    }

    .slot-timer {
      margin-top: 12px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.4;
    }

    body.modal-open .video-wrap {
      transform: scale(0.99);
    }

    .signup-modal {
      align-items: start;
      overflow-y: auto;
      padding: 18px 14px;
    }

    .signup-card {
      width: min(100%, 460px);
      padding: 22px;
    }

    .signup-card h2 {
      font-size: clamp(28px, 8.5vw, 38px);
      line-height: 1.04;
    }

    .signup-form {
      margin-top: 18px;
    }

    @keyframes mobileFadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }

  @media (max-width: 420px) {
    body {
      padding-inline: 12px;
    }

    .video-heading {
      font-size: clamp(28px, 9.4vw, 38px);
    }

    .hero-cta {
      font-size: clamp(18px, 5.7vw, 23px);
      padding-inline: 14px;
    }
  }

  @media (max-height: 760px) and (min-width: 641px) {
    .video-wrap {
      width: min(42vw, 620px);
    }

    .video-heading {
      font-size: clamp(30px, 3.8vw, 54px);
      margin-bottom: 12px;
    }

    .hero-cta {
      margin-top: 16px;
      padding-block: 15px;
      font-size: clamp(19px, 1.8vw, 26px);
    }

    .slot-timer {
      font-size: 14px;
      line-height: 1.3;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body {
      transition: none;
    }

    .man,
    .video-wrap {
      animation: none;
      opacity: 1;
    }

    .man {
      transform: translateX(0);
    }

    .video-wrap {
      transform: translate(-10%, -50%);
    }
  }
</style>
</head>

  <div class="video-wrap" aria-label="Video">
    <h1 class="video-heading">Learn How To Make Your First $100K In Roofing.</h1>
    <div class="video-container" id="heroVideoToggle">
      <video id="heroVideo" autoplay muted loop playsinline preload="metadata">
        <source src="01_the_easy_yes.mp4" type="video/mp4">
      </video>
    </div>
    <button class="hero-cta" type="button">YES I want to Learn More!</button>
    <div class="slot-timer" id="slotTimer" aria-live="polite">
      Enrollment is limited each week to keep the training hands-on and focused. Once this week's spots are filled, new members will be placed into next week's intake. Sign ups close in <span class="slot-time" id="slotTime">15:00</span>.
    </div>
  </div>

  <div class="signup-modal" id="signupModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
    <div class="signup-card">
      <h2 id="signupTitle">Sign up Now To Reserve Your Spot!</h2>
      <form class="signup-form" id="signupForm">
        <input type="text" name="firstName" placeholder="First name" autocomplete="given-name" required>
        <input type="text" name="lastName" placeholder="Last name" autocomplete="family-name" required>
        <input type="email" name="email" placeholder="Email address" autocomplete="email" required>
        <input type="tel" name="phone" placeholder="Phone number" autocomplete="tel" required>
        <button class="signup-submit" type="submit">Reserve My Spot</button>
      </form>
      <button class="signup-close" type="button" id="signupClose">Close</button>
      <div class="signup-message" id="signupMessage" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const heroVideo = document.getElementById('heroVideo');
    const heroVideoToggle = document.getElementById('heroVideoToggle');
    const heroCta = document.querySelector('.hero-cta');
    const slotTimer = document.getElementById('slotTimer');
    const slotTime = document.getElementById('slotTime');
    const signupModal = document.getElementById('signupModal');
    const signupClose = document.getElementById('signupClose');
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');
    const countdownDurationMs = 15 * 60 * 1000;
    const deadlineKey = 'roofingSlotsDeadline';
    let videoMutedBeforeModal = true;
    let visitorChangedVolume = false;
    let heroReady = false;

    const revealLanding = () => {
      if (heroReady) return;
      heroReady = true;
      document.body.classList.remove('is-loading');
    };

    const startHeroVideo = () => {
      if (!visitorChangedVolume) {
        heroVideo.muted = true;
        heroVideo.defaultMuted = true;
      }
      heroVideo.playsInline = true;
      const playAttempt = heroVideo.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(() => {});
      }
    };

    heroVideo.muted = true;
    heroVideo.defaultMuted = true;
    heroVideo.playsInline = true;
    heroVideo.load();
    heroVideo.addEventListener('loadeddata', () => {
      revealLanding();
      startHeroVideo();
    }, { once: true });
    heroVideo.addEventListener('canplay', () => {
      revealLanding();
      startHeroVideo();
    }, { once: true });
    window.addEventListener('pageshow', startHeroVideo);
    window.addEventListener('load', revealLanding, { once: true });
    setTimeout(revealLanding, 900);
    setTimeout(startHeroVideo, 500);
    setTimeout(startHeroVideo, 1500);

    heroVideoToggle.addEventListener('click', () => {
      visitorChangedVolume = true;
      heroVideo.muted = !heroVideo.muted;
      const playAttempt = heroVideo.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(() => {});
      }
    });

    const openSignupModal = () => {
      if (heroCta.disabled) return;

      videoMutedBeforeModal = heroVideo.muted;
      heroVideo.muted = true;
      document.body.classList.add('modal-open');
      signupModal.classList.add('is-open');
      signupModal.setAttribute('aria-hidden', 'false');
      signupMessage.textContent = '';
      signupForm.querySelector('input').focus();
    };

    const closeSignupModal = () => {
      signupModal.classList.remove('is-open');
      signupModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      heroVideo.muted = videoMutedBeforeModal;
    };

    heroCta.addEventListener('click', openSignupModal);
    signupClose.addEventListener('click', closeSignupModal);

    signupModal.addEventListener('click', (event) => {
      if (event.target === signupModal) closeSignupModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && signupModal.classList.contains('is-open')) {
        closeSignupModal();
      }
    });

    const captureLead = (lead) => {
      return fetch('/api/sheets/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventType: 'lead', lead, source: 'landing_page' })
      }).catch(() => {});
    };

    signupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const signupData = Object.fromEntries(new FormData(signupForm).entries());
      const firstName = String(signupData.firstName || '').trim();
      const lastName = String(signupData.lastName || '').trim();
      const lead = {
        firstName,
        lastName,
        name: [firstName, lastName].filter(Boolean).join(' '),
        email: signupData.email || '',
        phone: signupData.phone || '',
        submittedAt: new Date().toISOString()
      };
      localStorage.setItem('roofingSignupLead', JSON.stringify(lead));
      signupMessage.textContent = 'Your spot has been reserved. Saving your info...';
      await captureLead(lead);
      signupMessage.textContent = 'Taking you to the live room...';
      signupForm.reset();
      setTimeout(() => {
        window.location.href = '02_livestream_replay.html';
      }, 900);
    });

    let deadline = Number(localStorage.getItem(deadlineKey));

    if (!deadline || deadline <= Date.now()) {
      deadline = Date.now() + countdownDurationMs;
      localStorage.setItem(deadlineKey, String(deadline));
    }

    const closeSignups = () => {
      heroCta.disabled = true;
      heroCta.textContent = 'Sign Ups Are Closed';
      slotTimer.textContent = 'Slots are full. We are not taking anymore sign ups.';
    };

    const updateSlotTimer = () => {
      const remainingMs = Math.max(0, deadline - Date.now());

      if (remainingMs === 0) {
        closeSignups();
        return;
      }

      const totalSeconds = Math.ceil(remainingMs / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      slotTime.textContent = `${minutes}:${seconds}`;
    };

    updateSlotTimer();
    setInterval(updateSlotTimer, 1000);
  </script>

</body>
</html>
